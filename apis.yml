name: Deeptrace
description: >-
  Deeptrace is an AI SRE (site reliability engineering) agent that automatically
  investigates and root-causes production alerts by reasoning across logs, traces,
  metrics, and code. It triages and prioritizes alerts, produces evidence-backed root
  cause analyses in a couple of minutes, answers natural-language questions about
  production from Slack or the web app, and can auto-generate remediation such as pull
  requests and GitHub Actions. Deeptrace connects to the existing toolchain — Datadog,
  Grafana, New Relic, Sentry, Honeycomb, Coralogix, AWS CloudWatch, PagerDuty, GitHub,
  Linear, and Slack — to cut mean time to resolution. It exposes a REST API to trigger
  investigations, poll results, and drive AI chat programmatically. Founded 2025 and
  backed by Felicis, Matrix, and Y Combinator.
